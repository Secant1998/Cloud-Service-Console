<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>腾讯云直播观看</title>
    <link rel="stylesheet" href="https://web.sdk.qcloud.com/player/tcplayer/release/v4.9.1/tcplayer.min.css" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020617;
        color: #e5edf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        background:
          radial-gradient(circle at 18% 8%, rgba(37, 99, 235, 0.2), transparent 34%),
          linear-gradient(135deg, #020617, #0f172a 52%, #08111f);
      }

      .topbar {
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(18px);
      }

      .title {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .title strong {
        font-size: 16px;
      }

      .title span {
        min-width: 0;
        color: #94a3b8;
        font: 12px/1.4 "Cascadia Mono", Consolas, monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stage {
        min-height: 0;
        padding: 18px;
        display: grid;
        place-items: center;
      }

      .player-shell {
        width: min(100%, calc((100vh - 112px) * 16 / 9));
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 14px;
        background: #000513;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
      }

      #tencent-cloud-web-player,
      #tencent-cloud-web-player video,
      #tencent-cloud-web-player .tcplayer,
      #tencent-cloud-web-player .video-js {
        width: 100% !important;
        height: 100% !important;
      }

      .message {
        padding: 10px 12px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 999px;
        color: #cbd5e1;
        background: rgba(15, 23, 42, 0.72);
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      @media (max-width: 720px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .stage {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="title">
        <strong>腾讯云直播观看</strong>
        <span id="play-url">等待播放地址</span>
      </div>
      <div class="message" id="message">正在准备播放器</div>
    </header>
    <main class="stage">
      <div class="player-shell">
        <video id="tencent-cloud-web-player" preload="auto" playsinline controls></video>
      </div>
    </main>
    <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.9.1/tcplayer.v4.9.1.min.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const playUrl = String(params.get("url") || "").replace(/\s+/g, "").trim();
      const message = document.getElementById("message");
      const playUrlLabel = document.getElementById("play-url");
      playUrlLabel.textContent = playUrl || "未提供播放地址";

      function setMessage(text) {
        message.textContent = text;
      }

      if (!playUrl || !playUrl.startsWith("webrtc://")) {
        setMessage("播放地址无效");
      } else if (!window.TCPlayer) {
        setMessage("腾讯云播放器加载失败");
      } else {
        setMessage("正在连接直播流");
        const player = window.TCPlayer("tencent-cloud-web-player", {
          autoplay: true,
          controls: true,
          live: true,
          wording: {
            2032: "请求视频失败，请检查播放地址或播放域名配置",
            2048: "请求 m3u8 文件失败，可能是网络错误或跨域问题",
          },
        });
        player.on && player.on("playing", () => setMessage("正在播放"));
        player.on && player.on("loadeddata", () => setMessage("正在播放"));
        player.on && player.on("webrtcwaitend", () => setMessage("正在播放"));
        player.on && player.on("error", () => setMessage("播放失败，请检查地址或域名配置"));
        player.src && player.src(playUrl);
        const result = player.play && player.play();
        if (result && result.catch) {
          result.catch(() => setMessage("播放器已就绪，请点击画面播放"));
        }
      }
    </script>
  </body>
</html>
